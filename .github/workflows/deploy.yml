name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo export --platform web
      - name: Fix paths for GitHub Pages
        run: |
          sed -i 's|href="/favicon.ico"|href="favicon.ico"|g' dist/index.html
          sed -i 's|href="/_expo|href="_expo|g' dist/index.html
          sed -i 's|src="/_expo|src="_expo|g' dist/index.html
          sed -i 's|href="/manifest.json"|href="manifest.json"|g' dist/index.html
          sed -i 's|href="/sw.js"|href="sw.js"|g' dist/index.html
          sed -i 's|href="/assets|href="assets|g' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
